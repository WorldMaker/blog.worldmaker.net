name: Lume Dry Run

on:
  # Runs on pull requests targeting the default branch
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  # Build job
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - run: npm ci
    - run: npm test